name: Site contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Run JavaScript contracts, including Worker security
        run: npm run test:media

      - name: Validate Cloudflare Worker bundle and bindings
        run: npm run worker:check

      - name: Validate isolated Cloudflare staging bundle and bindings
        run: npm run worker:check:staging

      - name: Verify published media
        run: npm run media:verify

      - name: Verify original media provenance
        run: npm run media:originality

      - name: Build allowlisted publication artifact
        run: npm run site:build

      - name: Install PDF inspection dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.txt

      - name: Run site contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
